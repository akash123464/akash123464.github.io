<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishwork — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="admin">

  <div class="ambient-ripples" aria-hidden="true"><span></span><span></span><span></span></div>

  <div id="authGate" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="spinner"></div>
  </div>

  <div id="adminShellWrap" class="hidden">
    <nav class="navbar">
      <div class="navbar-inner glass-panel">
        <div class="navbar-logo">
          <svg class="ripple-mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="24" cy="24" r="5" fill="#6C5CE7"/>
            <circle cx="24" cy="24" r="14" stroke="#8B7CF6" stroke-width="2" opacity="0.55"/>
            <circle cx="24" cy="24" r="22" stroke="#2BD9C9" stroke-width="1.5" opacity="0.35"/>
          </svg>
          <span class="navbar-logo-text">Wishwork Admin</span>
        </div>
        <div class="navbar-right">
          <a href="index.html" class="btn btn-ghost btn-sm">← Back to app</a>
          <button type="button" class="btn btn-outline btn-sm" id="adminLogoutBtn">Log out</button>
        </div>
      </div>
    </nav>

    <main class="admin-shell">
      <h1>Dashboard</h1>
      <p style="color:var(--ink-500); margin-top:4px;">Platform statistics, posts, and members.</p>

      <div class="stats-grid">
        <div class="stat-card glass-panel">
          <div class="stat-value" id="statPendingApplications">–</div>
          <div class="stat-label">Pending applications</div>
        </div>
        <div class="stat-card glass-panel">
          <div class="stat-value" id="statPendingPosts">–</div>
          <div class="stat-label">Pending posts</div>
        </div>
        <div class="stat-card glass-panel">
          <div class="stat-value" id="statTotalUsers">–</div>
          <div class="stat-label">Total members</div>
        </div>
        <div class="stat-card glass-panel">
          <div class="stat-value" id="statTotalPosts">–</div>
          <div class="stat-label">Total posts</div>
        </div>
        <div class="stat-card glass-panel">
          <div class="stat-value" id="statPostsToday">–</div>
          <div class="stat-label">Posts in the last 24h</div>
        </div>
      </div>

      <div class="admin-tabs">
        <button type="button" class="pill active" id="adminTabApplications">Applications</button>
        <button type="button" class="pill" id="adminTabPosts">Posts</button>
        <button type="button" class="pill" id="adminTabUsers">Users</button>
      </div>

      <section class="admin-panel glass-panel" id="adminApplicationsPanel">
        <div class="application-filters">
          <button type="button" class="pill active" id="filterPending" data-status="pending">Pending</button>
          <button type="button" class="pill" id="filterApproved" data-status="approved">Approved</button>
          <button type="button" class="pill" id="filterRejected" data-status="rejected">Rejected</button>
        </div>
        <div id="adminApplicationsLoading" class="spinner"></div>
        <div id="adminApplicationsList"></div>
        <div class="empty-state hidden" id="adminApplicationsEmpty">
          <div class="empty-icon">🌿</div>
          <p>No applications here right now.</p>
        </div>
      </section>

      <section class="admin-panel glass-panel hidden" id="adminPostsPanel">
        <div class="application-filters post-filters">
          <button type="button" class="pill active" id="postFilterPending" data-status="pending">Pending</button>
          <button type="button" class="pill" id="postFilterApproved" data-status="approved">Approved</button>
          <button type="button" class="pill" id="postFilterRejected" data-status="rejected">Rejected</button>
          <button type="button" class="pill" id="postFilterAll" data-status="all">All</button>
        </div>
        <div id="adminPostsLoading" class="spinner"></div>
        <div id="adminPostsList"></div>
        <div class="empty-state hidden" id="adminPostsEmpty">
          <div class="empty-icon">📭</div>
          <p>No posts here right now.</p>
        </div>
      </section>

      <section class="admin-panel glass-panel hidden" id="adminUsersPanel">
        <div id="adminUsersLoading" class="spinner"></div>
        <div id="adminUsersList"></div>
        <div class="empty-state hidden" id="adminUsersEmpty">
          <div class="empty-icon">👥</div>
          <p>No members yet.</p>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
