<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishwork — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Login gate -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <a href="index.html" class="wordmark"><span class="seal">W</span>Wishwork</a>
    <p class="sub">Admin sign in</p>
    <form id="loginForm">
      <div class="form-msg error" id="loginMsg" style="display:none;"></div>
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="muted" style="text-align:center; margin-top:18px;">Admin accounts are created in the Firebase console, not here.</p>
  </div>
</div>

<!-- Admin shell (shown once signed in) -->
<div class="admin-shell" id="adminShell" style="display:none;">
  <div class="admin-topbar">
    <a href="index.html" class="wordmark"><span class="seal">W</span>Wishwork</a>
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="products">Products</button>
      <button class="admin-tab" data-tab="orders">Orders</button>
    </div>
    <button class="btn btn-outline" id="logoutBtn" style="border-color:var(--paper); color:var(--paper); padding:8px 16px;">Sign out</button>
  </div>

  <main class="admin-main">

    <!-- Products panel -->
    <section id="productsPanel">
      <div class="admin-panel-head"><h1>Products</h1></div>
      <div class="stat-row">
        <div class="stat-box"><div class="num" id="productStatTotal">0</div><div class="label">Total products</div></div>
        <div class="stat-box"><div class="num" id="productStatOOS">0</div><div class="label">Out of stock</div></div>
      </div>

      <div class="admin-grid">
        <div class="admin-card">
          <h3 id="productFormTitle">Add product</h3>
          <form id="productForm">
            <div class="form-msg" id="productFormMsg" style="display:none;"></div>

            <label class="image-drop">
              <div id="imagePreviewWrap"><span>Click to choose an image</span></div>
              <input type="file" id="imageInput" accept="image/*">
            </label>

            <div class="field" style="margin-top:16px;">
              <label for="pName">Product name</label>
              <input type="text" id="pName" name="name" required>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="pPrice">Price (₹)</label>
                <input type="number" id="pPrice" name="price" min="1" step="1" required>
              </div>
              <div class="field">
                <label for="pStock">Stock</label>
                <input type="number" id="pStock" name="stock" min="0" step="1" placeholder="e.g. 20">
              </div>
            </div>
            <div class="field">
              <label for="pCategory">Category</label>
              <input type="text" id="pCategory" name="category" placeholder="e.g. Home, Fashion, Electronics">
            </div>
            <div class="field">
              <label for="pDescription">Description</label>
              <textarea id="pDescription" name="description" rows="3"></textarea>
            </div>

            <div style="display:flex; gap:10px;">
              <button type="submit" class="btn btn-primary btn-block">Save product</button>
              <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;">Cancel</button>
            </div>
          </form>
        </div>

        <div class="admin-card" style="padding:0; overflow-x:auto;">
          <table class="data-table">
            <thead>
              <tr><th></th><th>Product</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
            </thead>
            <tbody id="productTableBody"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Orders panel -->
    <section id="ordersPanel" style="display:none;">
      <div class="admin-panel-head"><h1>Orders</h1></div>
      <div class="stat-row">
        <div class="stat-box"><div class="num" id="orderStatTotal">0</div><div class="label">Total orders</div></div>
        <div class="stat-box"><div class="num" id="orderStatPending">0</div><div class="label">Pending</div></div>
      </div>
      <div class="admin-card" style="padding:0; overflow-x:auto;">
        <table class="data-table">
          <thead>
            <tr><th>Customer</th><th>Items</th><th>Total</th><th>Date</th><th>Status</th></tr>
          </thead>
          <tbody id="orderTableBody"></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<!-- Firebase Compat SDK — global `firebase` namespace, no ES module imports -->
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
</body>
</html>
