<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · WishWork</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="topnav">
  <a href="index.html" class="brand"><span class="brand-mark"></span>WishWork</a>
  <div class="nav-actions">
    <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">☀️</button>
  </div>
</nav>

<div class="container">
  <div class="hero" style="padding-bottom:0;">
    <div class="wish-orb"></div>
  </div>

  <div class="glass auth-card">
    <h2 id="modeTitle" style="font-size:1.4rem; margin-bottom:6px;">Welcome back</h2>
    <p id="modeSubtitle" style="color:var(--text-secondary); font-size:0.88rem; margin:0 0 22px;">
      Sign in to post, comment, and debate ideas.
    </p>

    <div id="errorMsg" class="error-msg"></div>

    <form id="authForm">
      <div class="field" id="nameField" style="display:none;">
        <label for="nameInput">Name</label>
        <input type="text" id="nameInput" placeholder="What should we call you?" autocomplete="name">
      </div>
      <div class="field">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="field">
        <label for="passwordInput">Password</label>
        <input type="password" id="passwordInput" placeholder="••••••••" required minlength="6" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Sign in</button>
    </form>

    <div class="divider">or</div>

    <button class="btn btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.85 2.09-1.81 2.73v2.27h2.92c1.71-1.57 2.69-3.89 2.69-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.81 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71a5.4 5.4 0 010-3.42V4.95H.96a9 9 0 000 8.1l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.95l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <div class="auth-switch">
      <span id="switchModeText">New to WishWork?</span>
      <button id="switchModeBtn">Create an account</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>WishWork · a small, moderated space for better-Earth ideas</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
